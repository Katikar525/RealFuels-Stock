 @PART[radialLiquidEngine1-2]:FOR[RealFuels_StockEngines] //Mark 55 Radial
{

  @mass = 0.19
  @cost = 355
  %entryCost = 1775
  @maxTemp = 2042


  @MODULE[ModuleEngine*]
  {
    @name = ModuleEnginesRF
    @maxThrust = 120
    @heatProduction = 162
    @atmosphereCurve
    {
      @key,0 = 0 319
      @key,1 = 1 262
    }
    !PROPELLANT[LiquidFuel] {}
    !PROPELLANT[Oxidizer] {}
    !PROPELLANT[MonoPropellant] {}
