// Boabab

@PART[bluedog_NERVA_XE]:FOR[RealFuels_StockEngines]
{
	@MODULE[ModuleEngine*]
	{
		@name = ModuleEnginesRF
		@atmosphereCurve
		{
			@key,0 = 0 801
			@key,1 = 1 50
		}
		!PROPELLANT[LqdHydrogen] {}
		PROPELLANT
		{
		name = LqdHydrogen
		ratio = 100.000000
		DrawGauge = True
		%resourceFlowMode = STACK_PRIORITY_SEARCH
		}

	}

	MODULE
	{
		name = ModuleEngineConfigs
		type = ModuleEnginesRF
		techLevel = 5
		origTechLevel = 5
		engineType = N
		origMass = 2.25
		configuration = NERVA XE
		modded = false

		CONFIG
		{
			name = NERVA XE
			@MODULE[ModuleEnginesFX] { maxThrust = #$DATA/maxThrust$}
			%LinkB9PSModule[engineSwitch] { %subtype = NERVA_XE }
			PROPELLANT
			{
				name = LqdHydrogen
				ratio = 100
				DrawGauge = True
				%resourceFlowMode = STACK_PRIORITY_SEARCH
			}
			PROPELLANT
			{
				name = EnrichedUranium
				ratio = 0.00000000001
			}
			IspSL = 0.759213759
			IspV = 1.0
			throttle = 0
			ignitions = 0
			ullage = true
			pressureFed = false
			IGNITOR_RESOURCE
			{
				name = ElectricCharge
				amount = 20
			}
		}
		CONFIG
		{
			name = NERVA FF Carbide Fuel
			@MODULE[ModuleEnginesFX] { maxThrust = #$DATA/maxThrust$}
			@maxThrust *= 1.2511251125
			%LinkB9PSModule[engineSwitch] { %subtype = NERVA_XE_1500MW }
			addedCost = 2500
			PROPELLANT
			{
				name = LqdHydrogen
				ratio = 100
				DrawGauge = True
				%resourceFlowMode = STACK_PRIORITY_SEARCH
			}
			PROPELLANT
			{
				name = EnrichedUranium
				ratio = 0.00000000001
			}
			IspSL = 0.759213759
			IspV = 1.0511860175
			throttle = 0
			ignitions = 0
			ullage = true
			pressureFed = false
			IGNITOR_RESOURCE
			{
				name = ElectricCharge
				amount = 20
			}
		}
		
	}
	ignitions = 0
	ullage = true
	pressureFed = false
	IGNITOR_RESOURCE
	{
		name = ElectricCharge
		amount = 20
	}

  !MODULE[ModuleAlternator] {}
  !MODULE[ModuleGenerator] {}
  !RESOURCE[EnrichedUranium] {}
  !RESOURCE[DepletedUranium] {}
	MODULE
	{
		name = ModuleAlternator
		OUTPUT_RESOURCE
		{
			name = EnrichedUranium
			rate = -5E-18
		}
		OUTPUT_RESOURCE
		{
			name = DepletedUranium
			rate = 5E-18
		}
		OUTPUT_RESOURCE
		{
			name = ElectricCharge
			rate = 3
		}
	}
	MODULE
	{
		name = ModuleGenerator
		isAlwaysActive = true
		OUTPUT_RESOURCE
		{
			name = ElectricCharge
			rate = 1.5
		}
		OUTPUT_RESOURCE
		{
			name = DepletedUranium
			rate = 5E-18
		}
		INPUT_RESOURCE
		{
			name = EnrichedUranium
			rate = 5E-18
		}
	}
	RESOURCE
	{
		name = EnrichedUranium
		amount = 5
		maxAmount = 5
	}
	RESOURCE
	{
		name = DepletedUranium
		amount = 0
		maxAmount = 5
	}
}


