@PART[bluedog_Vanguard_S2_Tank]:FOR[RealFuels_StockEngines]
{	
	@MODULE[ModuleEngineConfigs]:HAS[#engineID[RCS]]
	{
	
		!CONFIG[Nitrogen] {}
		!CONFIG[UDMH+IRFNA-III] {}
		!CONFIG[Aerozine50+NTO] {}
		!CONFIG[MMH+NTO] {}
	}
	
	@MODULE[ModuleB9PartSwitch]:HAS[#moduleID[volumeSwitch]]
	{
		@SUBTYPE,0
		{
			MODULE
			{
				IDENTIFIER
				{
					name = ModuleFuelTanks
				}
				DATA
				{
					volume = 325
					TANK
					{
						name = Hydrazine
						amount = full
						maxAmount = 7.6923076923%

					}
				}
			}
		}
        
		@SUBTYPE,1
		{
			!volumeAddedToParent
            
			MODULE
			{
				IDENTIFIER
				{
					name = ModuleFuelTanks
				}
				DATA
				{
					volume = 625
					TANK
					{
						name = Hydrazine
						amount = full
						maxAmount = 4%
					}
				}
			}
 		}
	}
}

